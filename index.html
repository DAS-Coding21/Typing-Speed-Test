<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="typing-testing-container pt-4 pb-5 ps-3 pe-3">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <h1 class="heading mb-3">Speed Typing Test</h1>
                    <p class="lets-go-greating mb-3">On your fingers lets Go!</p>
                    <div class="text-center">
                        <div id="spinner" class="spinner-border d-none" role="status">
                            <span class="sr-only"></span>
                        </div>
                    </div>
                    <div class="d-flex align-items-center mb-3">
                        <img src="https://assets.ccbp.in/frontend/dynamic-webapps/clock-img.png" alt="timer-image"
                            class="timer-img me-4">
                        <div class="d-flex align-items-end">
                            <p id="timer" class="timer-in-sec">
                                0
                            </p>
                            <p class="word-second">seconds</p>
                        </div>
                    </div>
                    <div id="speedTypingTest"
                        class="quote-container mt-3 p-3 d-flex flex-column justify-content-center">
                        <p id="quoteDisplay" class="quote-display  text-start">
                            
                        </p>
                        <textarea rows="5" placeholder="Type here!!" id="quoteInput" class="quote-input mb-2"></textarea>
                    </div>
                    <p id="result" class="result-text mt-3">
                        
                    </p>
                    <div class="mt-4">
                        <button id="submitBtn" class="submit-btn me-3">Submit</button>
                        <button id="resetBtn" class="reset-btn">Reset</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
